# ============================================================
# 短剧工坊 · 唯一常数表
# 所有判据阈值只在这里定义，代码里不许写死数字。
# 项目级差异写 <项目>/config/overrides.toml，深覆盖本表。
# ============================================================

[meta]
name = "短剧工坊"
version = "0.6.1"
python = ">=3.11"

# ------------------------------------------------------------
# 两个正交维度 —— 别混
# ------------------------------------------------------------
# **形态（form）**：画面从哪来。换的是媒介，不是题材。
#   live_action  真人与 AI 写实视频短剧（连续视频，有人演或有"表演"）
#   anime        动漫短剧（连续动画，cel-shading，角色靠四视图锁）
#   motion_comic 动态漫（静态帧 + 推拉摇移，Ken Burns）
#   static_comic 静态漫 / 条漫（静态格，无运镜，气泡 + 停留）
#
# **档位（profile）**：镜头语言，只管单镜多长最稳、长镜算不算省机位。
#   ai   生成档（AI 出片，单镜 3-4 秒最稳）
#   live 真人实拍档（长镜省机位，一个中景长镜演完整段对话）
#
# 覆盖优先级：**项目 overrides > 形态 > 档位 > 全局基线**，顺序不能反。
# 别名：comic = motion_comic（旧项目兼容）

# 当前项目默认选用哪个规格（可被项目 overrides 的 [select] 覆盖）
# platform → [platform.*] 表；model → [model.*] 表
[select]
platform = "default"
model = "default"


# ------------------------------------------------------------
# 单集完结（live_action 基线）
# ------------------------------------------------------------
[single]
target_duration_s = 140     # 单集目标总时长（秒）
duration_tolerance = 0.15   # 允许偏差 ±15%
shots_min = 28              # 最少镜数
shots_max = 45              # 最多镜数
hook_window_s = 3           # 黄金 3 秒：镜 1 不得超过，且不得靠旁白交代
act_ratios = [0.14, 0.34, 0.37, 0.16]  # 四段配比：处境 / 压力 / 反转 / 余味


# ------------------------------------------------------------
# 系列连载
# ------------------------------------------------------------
[series]
episode_target_s = 90       # 单集目标时长（秒）
episodes_default = 60       # 默认集数
free_episodes = 3           # 免费集数（钩子最密区）
paywall_episode = 10        # 第一个付费卡点所在集
minor_climax_every = 10     # 每 N 集一个小高潮
major_climax_every = 30     # 每 N 集一个大高潮
# 系列**不检查**单集时长与镜数，但结尾镜必须是钩子（阻断级）


# ------------------------------------------------------------
# 镜头语言（live_action · AI 生成档基线）
# ------------------------------------------------------------
[shot]
sec_min = 2                 # 单镜最短时长
sec_max = 8                 # 单镜最长时长
core_sec_min = 3            # 核心镜长区间下界
core_sec_max = 4            # 核心镜长区间上界
core_ratio_min = 0.55       # 核心镜长合计占比下限
long_take_sec = 5           # 长镜阈值：≥ 此值必须含台词
reaction_max_sec = 3        # 纯画面情绪镜最长时长

# ------------------------------------------------------------
# 景别白名单（视频形态）
# ------------------------------------------------------------
# ★ 漫剧有 [panel].sizes 兜底，**视频形态原先没有**，于是"荒谬景别"
#   这种值能一路通过 scan 与 check 发出去——而景别写错，模型会抽错提示词
#   （写"特写"能抽，写"荒谬景别"抽出来的是什么？没人知道）。
#   景别是**有限枚举**，不是自由文本：写了表外的词就是写错了，不是风格。
#   动漫是连续动画，用影视景别，与真人写实同一套。
#   漫剧用格名，白名单写在各自的 [panel].sizes 里。
[sizes.default]
sizes = ["大特写", "特写", "近景", "中景", "中全景", "全景", "远景"]

[sizes.anime]
sizes = ["大特写", "特写", "近景", "中景", "中全景", "全景", "远景"]

# ------------------------------------------------------------
# 资产台账（全局基线 = 真人 / AI 写实视频）
# ------------------------------------------------------------
# ★ 这一节此前的名字只在 [anime.asset] / [motion_comic.asset] 下有，
#   全局基线是空的 → **"出场人物必须已登记"对真人短剧根本不查**
#   （check_delivery 读 d["asset"]，取到空 dict 就整条跳过）。
#   而人物表登记对真人短剧同样成立——它跟"是不是画的"没有关系。
#   凡是"跟形态无关的纪律"，就必须写在全局基线上，否则等于只保护了两种形态。
[asset]
consistency_check = ["角色"]   # 分镜表出场的人必须在人物表登记过
                              # （服装/道具/表情在当前交付稿里没有对应列，
                              #   机器查不到——见 check_delivery 的"需人工核对"提示）


# ------------------------------------------------------------
# 整体质量
# ------------------------------------------------------------
[quality]
fixed_ratio_min = 0.65          # 固定镜头占比下限
close_medium_ratio_min = 0.60   # 近景 + 中景占比下限（视频形态按景别名取，漫剧按格名取）
dialogue_ratio_min = 0.40       # 有台词镜占比下限
dialogue_ratio_max = 0.65       # 有台词镜占比上限
hook_per_seconds = 20           # 均匀窗口：每 N 秒至少一个钩子点（兜底判据）


# ------------------------------------------------------------
# 秒级钩子锚点（爆破点）—— 比"均匀窗口"更接近真实爆款节奏
# ------------------------------------------------------------
# 均匀窗口（hook_per_seconds）管的是"不许有长段平淡"，锚点管的是
# "该炸的时候必须炸"。真实爆款的节奏不是均匀撒钩子，是**在固定秒数上
# 集中爆破**（红果低线爆款的七个常见爆破点）。
#
# anchors：锚点秒表。0 = 第一镜必须是对抗开场（不许铺垫）。
# anchor_gap_s：每个锚点允许的容差——到该秒为止，最后一个钩子距它
#   不得超过这个数；从未出现过钩子也算未命中。
# 超出本片总时长的锚点自动忽略（60 秒的片子不查 180s 锚点，
# 不该为够不着的秒数误报）。
# anchor_required = false 可整表关掉（比如实验性片段）。
[hook]
anchors = [0, 30, 60, 90, 120, 150, 180]
anchor_gap_s = 15
anchor_required = true


# ------------------------------------------------------------
# 生成失败模式分类 —— 能力上限之外，还要知道"会怎么失败"
# ------------------------------------------------------------
# [model.*] 说"最多能到哪"，本表说"超了会以什么形态失败、该怎么办"。
# 只有 detectable = true 的模式能被本系统机械预判；false 的只在
# 报告里列出，让人知道"这类失败出现了别怪剧本"。
# 注意：键名是中文，必须加引号——TOML 的裸键只认 A-Za-z0-9_-。
[failure.modes]
"时长超"   = {trigger = "单镜秒数超过该后端 max_shot_sec", fix = "显式拆镜，不许截断后发上游", detectable = true}
"字数超"   = {trigger = "单镜提示词超过 max_prompt_chars", fix = "删修饰词，只留主体、动作、景别", detectable = true}
"参考图超" = {trigger = "单镜参考图超过 ref_images_max", fix = "减到额度内，超了脸会漂", detectable = true}
"审核"     = {trigger = "平台审核拦截（词面/画面触发，事前不可完全预判）", fix = "换表述，按 compliance 表换掉近义说法", detectable = false}
"网络"     = {trigger = "生成请求超时或断流", fix = "重试不超过 max_retry 次，仍失败即停，不硬凑", detectable = false}


# ------------------------------------------------------------
# 故事质量评分卡（[story]）—— 量"有没有戏"的机械代理
# ------------------------------------------------------------
# scan 量镜头语言（镜多长、景别多近、钩子多密），量不到"本子有没有戏"。
# 本表补这一维，但先把一句实话写在前面：**戏好不好最终不可机械判**。
# 这里量的全是代理指标——爆款短剧反复出现的结构特征：
# 事情在发生（事件密度）、三幕都有揭示（反转结构）、空间在换（场景数）、
# 不靠旁白点题（点题自律）、有人可冲突（冲突面）。
#
# ★ 三条纪律：
# 1. **词表只收多字短语。** 单字会命中日常词（"却"命中"冷却"、"打"命中
#    "打听"），误报多了人就整个关掉这项——宁可漏，不可吵。
# 2. **评分是参考分，不是门槛。** scan 的阻断/警告结论不变，本表不拦稿，
#    只回答"这个本子的结构特征齐不齐"。
# 3. **判据必须能被语料证伪。** _test/quality_corpus.json 里的好稿必须
#    高分、差稿必须低分、两边不重叠；证伪不了自己的判据就删。
[story]
band_strong = 80            # ≥ 此值：结构特征齐全
band_weak = 60              # < 此值：回炉重想
w_events = 25               # 事件密度
w_echoes = 25               # 呼应结构（埋点与回收）
w_places = 20               # 空间变化
w_pointing = 15             # 点题自律
w_conflict = 15             # 冲突面

[story.events]
full_ratio = 0.50           # 事件镜占比达到此值拿满分（不足按比例）
# 变化动词：该镜"发生了事情"。两人坐着说完全场，这里是 0。
# ★ 教训（scan.py 的 HOOK_VISUAL 注释同款）：词表必须收**实际会写出来的
#   说法**。只收"推门"而剧本写"门被推开"，判据整条失效且不报错——
#   实测：初版词表漏了"门被推开/闪了/空了"，两个好示例事件密度被打成
#   2/24 与 4/32。宁可词表宽一点，不可让判据静默失灵。
words = ["推开", "门被推开", "合上", "关上", "打开", "开门", "关门",
         "站起来", "站起", "起身", "坐下", "蹲下", "跪下", "回头", "回过头",
         "转过身", "转身", "跑向", "跑过来", "跑出去", "冲过来", "走出去",
         "走进来", "走过来", "走过去", "追上", "停下来", "站住", "愣住",
         "发愣", "后退", "撞上", "摔倒", "摸出", "掏出", "拿出", "放下",
         "举起", "拿起", "抬起", "低下头", "抬头", "睁大", "闭上", "喘气",
         "屏住", "攥紧", "收紧", "闪过", "熄灭", "亮起", "黑屏",
         "没信号", "没有信号", "变了", "变成", "多了一个", "不见",
         "不见了", "消失", "空了", "空无一人", "没有人", "没人",
         "只有他", "只有她", "滴水", "湿透", "风铃", "响起", "警报",
         "停电", "漆黑", "沉默", "没说话", "移开", "别过脸", "背对",
         "背对着", "停住", "不动", "没动", "纹丝不动", "加快", "慢下来",
         "消息", "电话", "短信", "敲门", "屏幕", "电子屏", "监控",
         # ★ 补"实际会写出来的说法"（v0.6.1）。上一批收的是"敲门/开门/关门/
         #   低下头"，而分镜表里实际写的是"敲了三下""门开了一条缝"
         #   "把门带上""低头看了一眼""手还举着""坐在床边"——
         #   词表与写法对不上，判据就静默失灵，表现为"事件密度莫名很低"。
         #   实测《同意》：9 镜里 6 镜有明显外部事件，只认出 2 镜。
         "敲", "门开", "门带上", "把门带上", "带上门", "低头看", "举着",
         "坐在", "推着", "扶住", "撑住", "递", "接过", "没接", "塞进",
         "垂下来", "停住", "顿住", "定住", "抬眼", "看了一眼", "看过去",
         "倒影", "影子", "脚步声", "脚步", "安静", "没声音",
         "递给", "递过", "夺过", "抢过", "撕开", "撕碎", "摔门", "摔碎",
         "扔下", "扔掉", "砸下", "砸碎", "按住", "抓住", "揪住", "拉住",
         "拽住", "扶住", "塞进", "塞给"]
# ★ 单字已全部换成多字短语（"递"→"递给/递过"、"响"→"响起"、
#   "闪"→"闪过"、"灭"→"熄灭"）。单字会命中"快递""影响""消灭"，
#   而误报一次，人就会把整个维度关掉——宁可漏，不可吵。

[story.echoes]
# 呼应结构：埋下去的钉子，后面有人捡。**不靠词表，靠重复**——
# 关键 token（时刻/日期/物件/昵称）在相隔很远的两个镜头里再次出现，
# 就是一次"埋点→回收"。反例样本（两人对坐说完全场）通常一个都没有。
# 这比"反转词计数"鲁棒：台词怎么措辞都检测得到，而词表永远追不上写法
# （初版用"没想到/原来/真相"词表，两个好示例被判 0/3 幕与 1/3 幕）。
min_echoes = 3              # 达到此数量的远距重复拿满分
min_span_ratio = 0.25       # 两次命中的时间跨度 / 总时长，低于此不算"远"
max_shot_ratio = 0.30       # 命中镜数占比超过此值的是"胶水词"（主角名/
                            # 主语在几乎每镜出现），不是呼应——排除
max_hits = 6                # 命中次数上限，防"每镜都复读"的伪呼应
merge_jaccard = 0.6         # 同源切片合并阈值：滑窗会把"收银台"切出"收银""银台"，
                            # 三者命中同一批镜头=同一个现象。命中位置集合的
                            # Jaccard ≥ 此值即归为一簇，簇内取最长词作代表。
                            # ★ 不合并会虚胖：实测一个示例被数成 28 处呼应。
require_line = false        # 是否要求埋点"说出口过"（token 至少命中一次台词列）。
                            # ★ 实测是**得不偿失**的旋钮，默认关：
                            #   打开后坏样本（两人对坐说完全场）呼应分从 25 → 0，
                            #   但好样本也塌了——便利店 100→83、地铁 92→67，
                            #   因为"收据/伞架"这类真道具埋点只写在画面列。
                            #   坏样本靠事件密度/空间变化/点题三维已压到 42 回炉，
                            #   不需要在这里牺牲召回。留着这个开关是给"只认台词
                            #   埋点"的严格场景用的。
# 出现在这些字形里的候选词直接丢弃：虚词与高频功能字，
# 它们的重复是语法噪音，不是结构信号
stopchars = "的了是在有他她它我你和着过很都也与之被把让就那不没这"
stopwords = ["一个", "什么", "这个", "那个", "知道", "时候", "自己",
             "地方", "一下", "有些", "没有", "怎么", "这样", "那样",
             "还是", "已经", "可以", "起来", "下去", "个人",
             # 高频动作词：剧本里每镜都有的身位变化，重复是叙事节奏，
             # 不是"埋点→回收"。漏一个，呼应数就虚胖一度。
             "抬头", "低头", "回头", "看着", "看过", "站起", "坐下",
             "起身", "转身", "回来", "过去", "过来", "走回", "走出",
             "走进", "跑过", "打开", "开门", "关门", "一节", "回过",
             "伸手", "抬脚", "站住", "愣住", "背包", "沙发", "座位",
             "位置", "车厢", "车厢", "公司", "家里",
             # 舞台指示：括号里的说话人标注（"老师（画外）"）每镜都有，
             # 重复是格式，不是呼应。漏了它，"画外"会被当成一个埋点。
             "画外", "画外音", "屏幕", "手机屏幕", "便签", "材料", "桌面"]

[story.places]
full_count = 3              # distinct 场景数达到此值拿满分
# ★ 只收**空间**（一级场景），不收**空间里的位置**。
#   "门口""门前""床边""窗前""工位"是"某空间内的一处"，不是另一个空间：
#   楼道里的门前还是楼道，卧室里的床边还是卧室。
#   收了它们的后果：同一处戏被数成两三处场景，空间变化虚高——
#   实测《同意》只有楼道/卧室/电梯三处，被数成五处（床边/楼道/电梯/走廊/门前）。
#   ★ 这与"家具换了不算换地方"是同一族纪律，只是层级更深一层：
#   家具 < 位置 < 空间。判据只认空间。
#   要表达"这一镜在哪个位置"，写进"动作一句话"（如"卧室，床边"），
#   判据取其中的空间名。
words = ["客厅", "卧室", "厨房", "卫生间", "浴室", "阳台", "楼道",
         "电梯", "车里", "驾驶室", "办公室", "教室", "病房", "医院",
         "走廊", "天台", "楼顶",
         "街上", "路边", "地铁", "车厢", "公交", "站台", "公司",
         "学校", "派出所", "药店", "诊所", "银行", "便利店", "超市",
         "餐厅", "饭店", "酒吧", "宾馆", "酒店", "机场", "车站",
         "月台", "公园", "广场", "停车场", "车库", "巷子", "天桥",
         "审讯室", "会议室", "面试间", "诊室", "收银台"]
# ★ 只收"空间"，不收家具/道具：沙发、货架、柜台、收银都曾经在表里，
#   结果一个便利店示例被数成 6 处场景（便利店/收银/收银台/街上/货架/门口）。
#   空间变化量的是"戏换了地方没有"，家具换了不算。

[story.pointing]
marks = ["旁白", "字幕", "屏幕字", "标题卡"]       # 叙述手段标记
# 主题句模式：命中"叙述手段 + 主题句"即点题，每处扣 pointing_penalty。
# 好短剧演出来，不说出来。
themes = ["后来才", "直到后来", "这一刻", "那一刻", "终于明白", "才明白",
          "生活是", "人生是", "这就是", "告诉我们", "说的就是", "莫过于",
          "大概就是", "也许就是", "真正的", "从来都不", "一直都是"]
penalty = 5

[story.conflict]
min_characters = 2          # 画面里得有两个人才能吵起来
min_confront = 2            # 张力信号命中镜数下限
char_score = 8              # 人物数达标得分
confront_score = 7          # 张力信号达标得分
# 张力信号：对抗动作（多人戏）或悬疑窒息点（独角戏）。
# ★ 单人短剧（《最后一班地铁》全剧只有周宁）没有"两个人吵架"，
#   但"多了个人/纹丝不动/没信号"处处是张力——两路都算。
words = ["拦住", "推开", "夺过", "抢过", "撕碎", "摔门", "扔下",
         "砸下", "骂", "吼", "喝住", "喊住", "逼着", "拒绝", "不许",
         "不准", "争执", "争吵", "对峙", "拉扯", "拽住", "甩开",
         "冷着脸", "扭头走", "抵住", "按住", "抓住", "揪住", "瞪着",
         "盯着", "质问", "抵着", "挡在", "堵住", "撞上", "后退",
         "纹丝不动", "没了", "没有", "不见", "空了", "没人",
         "多了一个", "一模一样", "没信号", "没有信号", "闪过", "黑屏",
         "攥紧", "发抖", "喘气", "屏住", "脚步声", "安静",
         "没声音", "倒影", "影子", "不认识", "看不懂", "想不起来"]


# ------------------------------------------------------------
# 真人实拍档：只写与 AI 档的差异项
# ------------------------------------------------------------
# **两档判据方向相反。** AI 生成单镜 3-4 秒最稳，再长画面会崩、动作会漂，
# 所以 core_sec 3-4 / sec_max 8 / core_ratio ≥55%。真人实拍正好相反：
# 长镜省机位、表演连贯，一个中景长镜能把整段对话一次演完。
#
# 压缩镜头的正确做法不是"每镜都拉长"，而是
# "中景长镜承担连续段落，只给信息点留独立短镜"。
#
# 用法：项目 overrides 写 shot_profile = "live"，或 `dramakit scan --mode live`。
[live]
note = "真人实拍档：按表名分组，只覆盖差异项"

[live.shot]
sec_max = 10            # 真人没有画面稳定性上限
core_sec_min = 5        # 核心镜长 5-10 秒
core_sec_max = 10
core_ratio_min = 0.40   # 长镜是主力，但仍要留短镜给信息点
long_take_sec = 5
reaction_max_sec = 6    # 特写无台词反应镜可到 6 秒，演员需要时间建立情绪

[live.single]
# 镜数区间是 60 秒档的经验值（中景长镜 5-10 秒 → 6-12 镜）。
# 时长不是 60 秒的真人剧，请在项目 overrides 里覆盖 shots_min / shots_max。
shots_min = 6
shots_max = 12
# 开场窗口放宽到 6 秒：真人可以用一个中景长镜把人物和环境一次交代完，
# 只要镜内出现钩子信号就不算拖。AI 生成档必须卡 3 秒，因为再长画面就崩。
hook_window_s = 6

[live.quality]
fixed_ratio_min = 0.65  # 真人运镜偏固定

[live.hook]
anchor_gap_s = 20       # 真人长镜省机位，一个中景长镜能演完整段对话，
                        # 锚点容差比 AI 档宽——拿 AI 的秒级密度卡真人是用反尺子


# ------------------------------------------------------------
# 动漫短剧（anime）：连续动画
# ------------------------------------------------------------
# **动漫短剧 ≠ 漫剧。** 它是有连续动作的动画，不是静态帧推拉。
# 与真人/AI 写实视频的差别在"什么会崩"：
#   - AI 写实视频怕的是**画面崩、动作漂**（单镜 8 秒上限）
#     动漫是**画出来的**，没有稳定性上限，单镜可以更长；
#     但作画有**张数预算**，动作镜（打斗/跑动）单镜越长越贵，
#     所以"核心镜长"的意义从"最稳"变成"最经济"。
#   - 一致性靠**角色四视图 + 上色指定表**锁线条与配色，不是靠"脸像不像"。
#   - 有**定格/关键帧**语言：情绪靠定格 + 构图，不靠演员微表情。
#
# 用法：项目 overrides 写 form = "anime"，或 `dramakit scan --form anime`。
[anime]
note = "动漫短剧：连续动画，作画约束替代稳定性约束，角色靠四视图锁"

[anime.shot]
sec_min = 1.5           # 动画可以很短，一个定格就是 1.5 秒
sec_max = 12            # 画出来的没有"崩"的问题，长镜上限更宽
core_sec_min = 2.5      # 核心镜长 2.5-5 秒：经济区（少画几张，动作接得上）
core_sec_max = 5
core_ratio_min = 0.50
long_take_sec = 6       # 长镜阈值：≥ 此值必须含台词或画面事件
reaction_max_sec = 4    # 定格情绪格

[anime.single]
target_duration_s = 120
duration_tolerance = 0.15
shots_min = 22
shots_max = 46
hook_window_s = 3       # 开场同样紧，但动漫可以用一个强构图定格顶住

[anime.quality]
fixed_ratio_min = 0.45      # 动画运镜可以更多（推摇、跟镜是常规语言）
close_medium_ratio_min = 0.60
dialogue_ratio_min = 0.35
dialogue_ratio_max = 0.70
hook_per_seconds = 18

[anime.hook]
anchor_gap_s = 12       # 动画节奏比真人快、比 AI 写实稍慢，容差取中

# 动漫专用：作画与角色一致性
[anime.asset]
char_views = 4                  # 角色参考图：四视图（正/侧/背/表情）
color_sheet_required = true     # 必须有上色指定表，否则同一角色跨镜会换色
ref_per_shot_max = 3            # 单镜最多引用几张参考图
consistency_check = ["角色", "服装", "场景", "道具"]
style_anchor_required = true    # 全局风格锚点（防跨镜画风漂移）
# 注：动漫短剧用**影视景别**（近景/中景/特写），不是"格"——
# 它是有连续动作的动画，交付仍是视频列头。[anime.asset] 是资产台账，
# 与漫剧的"格表"不是一回事。


# ------------------------------------------------------------
# 漫剧（comic）＝ 动态漫 —— 静态帧 + 推拉摇移
# ------------------------------------------------------------
# **漫剧不是"用动画素材的短剧"，是另一种媒介。** 判据方向与两档视频都不同：
#
#   - 画面来源是**静态帧 + 推拉摇移**（Ken Burns），不是连续视频。
#     没有"动作会漂"的问题，所以单镜可以比 AI 写实档更短、切换更频；
#     但也没有表演，情绪全靠画面信息量与节奏。
#   - 对白走**气泡**，不配音。气泡有物理容量，字数超了就装不下——
#     这是硬约束，不是风格偏好。
#   - **角色一致性是漫剧的第一痛点**。真人换演员观众认得脸，漫剧换一张脸
#     观众只觉"哪里不对"但说不出，直接划走。所以漫剧必须登记资产
#     （角色四视图 / 场景圣经 / 表情服装道具枚举），跨镜漂移是主要事故。
#   - 存在"格"的概念：一组四格完成一个起承转合，节拍粒度比"镜"粗一级。
#
# 用法：项目 overrides 写 form = "comic"（或 motion_comic）。
[motion_comic]
note = "漫剧（动态漫）：静态帧+推拉、气泡对白、资产一致性优先"

[motion_comic.shot]
sec_min = 1.5           # 静态帧信息密度高，可以更短
sec_max = 6
core_sec_min = 2        # 核心镜长 2-3 秒：读画面 + 气泡的时间
core_sec_max = 3
core_ratio_min = 0.50
long_take_sec = 4       # 长镜阈值：≥ 此值必须含台词或画面事件
reaction_max_sec = 3    # 纯画面情绪格

[motion_comic.single]
shots_min = 24
shots_max = 50
hook_window_s = 2       # 漫剧滑动成本比视频低，开场窗口更紧
target_duration_s = 120
duration_tolerance = 0.15

[motion_comic.quality]
fixed_ratio_min = 0.40     # 推拉摇移是漫剧的常规语言，固定镜不该占多数
close_medium_ratio_min = 0.70
dialogue_ratio_min = 0.30  # 漫画以画面叙事，对白镜占比本就低于真人剧
dialogue_ratio_max = 0.70
hook_per_seconds = 15

[motion_comic.hook]
anchor_gap_s = 10       # 漫剧靠切格续节奏，格越短信息点越密，容差最小

[motion_comic.panel]
grid_min = 4           # 一组最少几格：起承转合
grid_max = 8
bubble_line_max = 60   # **气泡对白字数硬上限**——超了气泡装不下，不是风格问题
sizes = ["大格", "中格", "特写格", "远景格", "插入格"]   # 漫画景别（不用影视景别）
moves = ["固定", "推", "拉", "摇", "移"]               # 静态帧只可能有这些"运镜"
# 景别占比按漫画景别算，不用影视"近景/中景"——那是影视景别，写了会抽错提示词
close_sizes = ["大格", "中格", "特写格"]
close_ratio_min = 0.60   # 漫画要"读得清"，大格与中格要占多数

[motion_comic.asset]
char_views = 4         # 角色参考图数量：四视图（正/侧/背/表情）
ref_per_panel_max = 2  # 单格最多引用几个参考图：超出说明在自由发挥，脸会漂
scene_bible_required = true   # 场景必须在场景表登记，否则跨镜场景漂移无人发现
expression_enum = ["平静", "怒", "悲", "惊", "疑", "喜", "冷", "惧"]
costume_enum_required = true  # 服装必须来自登记表
consistency_check = ["角色", "场景", "服装", "道具"]   # 这四类跨镜必须可追溯


# ------------------------------------------------------------
# 静态漫 / 条漫（static_comic）：静态格，无运镜
# ------------------------------------------------------------
# 与动态漫的唯一区别是**没有运镜**：每格就是一张静止的图，停留够读的时间。
# 这条差别是硬的——写"推/拉/摇"就是写错了形态，出片时无法执行。
# 阅读顺序是硬约束：条漫从上到下，页漫从左上到右下。
[static_comic]
note = "静态漫/条漫：无运镜，靠停留时长与格序叙事"

[static_comic.shot]
sec_min = 2             # 停留时长：够读完气泡
sec_max = 8             # 一个信息密度高的格可以停久一点
core_sec_min = 2.5
core_sec_max = 4
core_ratio_min = 0.55
long_take_sec = 5
reaction_max_sec = 4

[static_comic.single]
shots_min = 20
shots_max = 44
hook_window_s = 3
target_duration_s = 120
duration_tolerance = 0.15

[static_comic.quality]
fixed_ratio_min = 1.0      # **必须全部固定**——静态漫有运镜就是形态写错了
close_medium_ratio_min = 0.60
dialogue_ratio_min = 0.30
dialogue_ratio_max = 0.75
hook_per_seconds = 16

[static_comic.hook]
anchor_gap_s = 10       # 静态漫无运镜，靠停留时长与格序，格短信息点密

[static_comic.panel]
grid_min = 4
grid_max = 8
bubble_line_max = 60
sizes = ["大格", "中格", "特写格", "远景格", "插入格"]
moves = ["固定"]          # 静态漫只可能有固定
close_sizes = ["大格", "中格", "特写格"]
close_ratio_min = 0.60
reading_order = "top_to_bottom"   # 条漫：从上到下


# ------------------------------------------------------------
