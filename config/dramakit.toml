# ------------------------------------------------------------
# 合规（发布前必过，不是风格建议）
# ------------------------------------------------------------
# 国内发布 AI 生成合成内容必须**显式标识**（《人工智能生成合成内容标识办法》）。
# 这一条是硬要求，且**机械可判**：交付稿里得有标识，且标识字段要真实。
#
# 三件事：
#   1. AIGC 标识必须在交付稿里出现（真人实拍可关）
#   2. 未成年人题材不拍受害细节（只判是否触碰，具体写法交人）
#   3. 敏感/违规表达扫描（影射真实单位与当事人、血腥、诱导）
[compliance]
aigc_label_required = true        # AI 生成内容必须带标识
aigc_label_text = "本片由 AI 生成合成"
aigc_label_in_delivery = true     # 标识必须写进交付稿的基本信息块
minors_protection = true          # 涉未成年人题材的保护
minors_terms = ["未成年", "小学", "初中", "幼儿园", "儿童", "男童", "女童"]
# 敏感表达：命中即警告，由人判断是否误报。
# ★ 只收**有明确指向的多字短语**。单字（如"表""局""师"）会命中"手表""表达"
#   "局面"这类日常词，产生大量误报——误报多了人就整个关掉这一项，等于没有。
sensitive_terms = [
    "真实姓名", "原型人物", "真人真事", "某某公司", "某某集团",   # 影射真实主体
    "跳楼", "割腕", "自残", "自杀方法", "轻生",                   # 具体自伤手段
    "上分", "开黑", "代练",                                       # 平台黑话（易限流）
]
# 违规词：命中即阻断（模拟政策红线）
forbidden_terms = ["代孕", "毒品交易", "枪支买卖", "赌博平台"]


# ------------------------------------------------------------
# 模型能力（生成后端的能力上限）
# ------------------------------------------------------------
# **超限必须拒绝，不得截断后调上游。** 模型吐不出来就是吐不出来，
# 把一个超长的提示词悄悄截短再发，等于让上游的不确定性静默变成下游的错误。
# 每一档都是**投产前要重新核验**的：模型能力会升级，别把它写成永久事实。
[model.default]
note = "通用默认：不确定用哪家时的保守值"
max_shot_sec = 8            # 单镜最长时长（秒），超了要拆镜
max_prompt_chars = 1500     # 单镜提示词字数上限，超了要删
ref_images_max = 3          # 单镜最多参考图张数（>1 张叫多图参考）
max_retry = 3               # 单镜最多重试次数
supports_multi_shot = false # 是否支持一镜到底多镜头

[model.seedance]
note = "Seedance 系：多镜头叙事 + 音频（能力以官方为准，投产前复核）"
max_shot_sec = 10
max_prompt_chars = 1500
ref_images_max = 4
max_retry = 3
supports_multi_shot = true
supports_audio = true

[model.wan]
note = "通义万相 Wan 系：多镜头 shot_type=multi，支持音频"
max_shot_sec = 5
max_prompt_chars = 1200
ref_images_max = 3
max_retry = 3
supports_multi_shot = true
supports_audio = true

[model.kling]
note = "可灵 Kling：首尾帧插值成熟"
max_shot_sec = 10
max_prompt_chars = 1500
ref_images_max = 2
max_retry = 3
supports_keyframe = true

[model.veo]
note = "Veo：关键帧驱动（首帧/尾帧）"
max_shot_sec = 8
max_prompt_chars = 1500
ref_images_max = 3
max_retry = 3
supports_keyframe = true


# ------------------------------------------------------------
# 付费卡点（系列连载的生死线）
# ------------------------------------------------------------
# 单集内部结构决定"这一集好不好看"，卡点决定"观众付不付费"。
# 四段式管前者，本表管后者。
#
# 三条硬规则，全部是确定性可算的：
#   1. **首付费集的前一集必须是情绪净值最低谷**——先憋到最狠，再给翻盘，
#      付费转化才起得来。顺序反了（付费前刚好爽完），观众没有付费动机。
#   2. **付费集结尾必须是钩子**，且卡点评分不低于阈值。
#   3. 小高潮 / 大高潮按固定 cadence 落位，不能挤在一起也不能断档。
#
# ★ 评分口径（v0.6.0 定）：百分制，基础分 + 高级加分 − 减分，上限 100。
#   - **基础项**（每集都该有）满分 100；
#   - **高级项**（有则更好）额外加分，但上限锁在 100；
#   - **减分项**从最终分里直接扣。
#
#   早先写 85 是按原始加权和想的，而原始满分只有 56 —— **永远达不到**。
#   这张表从定下来就没被执行过，所以这个错一直没被发现。
#   （同类毛病：门槛按"原始和"写、判据按"百分制"读，两边口径不一致。）
[cliff]
cliff_score_min = 70       # 卡点评分下限（百分制），低于此值报 warning
paywall_valley_required = true   # 规则 1 开关
climax_min_gap = 5         # 两个高潮之间至少隔几集（防挤堆）
emotion_release_every = 2  # 每 N 集至少一次情绪释放（防连续憋）
valence_max = 5            # 情绪净值满分（打分表用的量程）

# 卡点评分：全部可从分镜表机械判定，无一项需要人读剧本
[cliff.score]
# —— 基础项：每集都该有，合计 100 分 ——
line_hook = 25        # 结尾镜台词含钩子词（凭什么/为什么/其实/真相…）
visual_event = 25     # 结尾镜画面含突发事件（推门/摔倒/耳光/来电…）
emotion_close = 20    # 结尾镜是情绪特写
cliff_question = 30   # 结尾镜留下未答问题（疑问句收尾）
# —— 高级项：加分，上限锁 100 ——
info_reverse = 20     # 结尾镜出现信息反转（身份/关系/真相的揭示）
call_back = 20        # 结尾镜回收了早期伏笔（与前文重复的实词）
# —— 减分项 ——
flat_ending = 15      # 结尾镜是陈述句收尾，无事发生
narration_tell = 12   # 靠旁白/字幕交代而非画面

# 信息反转的信号词：只收多字短语。写"真相""其实"这类高频词会命中
# 日常对话（"其实我也不知道"），误报多了这条判据就废了。
# ★ 与 [story.conflict] 同族纪律：宁可漏，不可吵。
[cliff.words]
info_reverse = [
    "原来是你", "原来是他", "原来是", "竟然是你", "竟然是他", "竟然是",
    "真相是", "真相就是", "就是她", "就是他", "我是她", "我是他",
    "其实我", "其实他", "其实她", "一直以为", "从一开始", "一直以来",
    "你才是", "我才是", "我们都是", "你们都是", "不是别人",
    "转过身", "摘下", "撕开", "露出来", "露出", "摊开", "揭开",
]


# ------------------------------------------------------------
# 跨集一致性（series 专用）
# ------------------------------------------------------------
# 单集好做，连载会崩：到第 20-30 集人设飘、伏笔丢、时间轴对不上。
# 崩溃的真实形态是**文件与文件互相矛盾**——单看每一集都对，合起来不对。
# 所以这一组判据查的是"跨集引用完整性"，不是"某一集写得好不好"。
#
# 六列表：集 | 角色 | 服装 | 场景 | 道具 | 时间点
#
# ★ 下面每个开关都**真的控制一条判据**（v0.6.0 修正）。
#   早先这里写了 7 个开关，continuity.py 里一个都没读——表看起来在管事，
#   实际全是空转。空转的开关比没有开关更坏：它让人以为"这条有人管"。
#   现在每个开关对应 continuity.check() 里的一条判据，关掉即不查。
[continuity]
require_timeline = true        # T1/T2 时间轴：集号连续、相邻集时点不重复
timeline_gap_max_s = 0        # 相邻集时间轴允许的最大空档（秒），0 = 必须首尾相接
character_id_required = true   # C1/C2 角色 ID 唯一 + 分镜表出场角色都已登记
scene_reuse_tracked = true     # S1/X2 场景 ID 唯一 + 分镜表场景都已登记
costume_change_must_declare = true  # C3 换装必须显式声明是哪一集换的
foreshadow_double_bind = true  # F1/F2 伏笔表必须双向一致（埋点↔回收点都对得上）
dangling_ref_forbidden = true  # X1 禁止悬空引用（引用了不存在的角色/场景/伏笔 ID）


# ------------------------------------------------------------
# 交付格式（定死的，不要每次重新讨论）
# ------------------------------------------------------------
[delivery]
blocks = ["基本信息", "人物表", "场景", "分镜表", "验收额度"]
shot_columns = ["镜", "时长", "景别", "谁在画面", "动作一句话", "台词原文"]
# 漫剧/动漫向的交付表列头（格表：多了"格"与"参考图"列）
comic_columns = ["镜", "时长", "景别", "谁在画面", "画面一句话", "气泡对白"]
retake_max = 3          # 每镜最多重抽几次
on_fail = "停"          # 失败是停还是继续：停 | 继续
# 只发一个定稿 .md。不要 CSV、不要 Word、不要截图、不要英文提示词、
# 不要人物参考图、不要给两版剧情让人选。

[work]
# 骨架表（工作表）的列头。**与交付列头是两套东西**：
# 交付表给人看和拍，工作表还要能喂给 scan（运镜/声音）与填表人（开场站位）。
# ★ 开场站位这一列不是装饰：位置与朝向要在写动作之前定死。
#   不定死，跨镜就会出现"上一镜她在左、下一镜她在右"——观众说不出哪里不对，
#   只会觉得"这戏怪"。它排在"画面"前面，是因为先定位置再写动作。
# ★ 人物并进"画面"写成"谁｜动作"，与交付表的合并方式一致；
#   单独留一列"谁在画面"会让同一件事写两遍。
shot_columns = ["镜", "时长", "景别", "运镜", "开场站位", "画面", "台词", "声音"]
panel_columns = ["镜", "时长", "景别", "运镜", "开场站位", "画面一句话", "气泡对白"]
